# 로컬 Supabase 설정 (npx supabase start). 없는 항목은 CLI 기본값을 쓴다.
project_id = "oksori"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# 이웃 제보용 익명 로그인 (ADR-003)
enable_anonymous_sign_ins = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# 사장님 카카오 로그인 — 지금은 쓰지 않음 (ADR-006 가게 코드로 대체, ADR-002 나중에 재검토)
[auth.external.kakao]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_KAKAO_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_KAKAO_SECRET)"
